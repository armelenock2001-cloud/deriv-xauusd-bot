<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal XAU/USD (H4) - Biquote & Deriv</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 1.5rem;
            color: #f39c12;
        }
        #signal-container {
            background-color: #1e1e1e;
            border: 2px dashed #444;
            padding: 15px;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 400px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }
        button:active {
            background-color: #219653;
        }
        .btn-test {
            background-color: #2980b9;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Robot Signaux XAU/USD (H4)</h1>
    <p>Flux alimenté par Biquote — Analyse 4 Heures</p>

    <!-- Zone où le signal H4 et le compte à rebours s'affichent -->
    <div id="signal-container">
        <p>Connexion aux flux Biquote en cours...</p>
    </div>

    <!-- Bouton pour valider et prendre position sur Deriv -->
    <button onclick="validerEtExecuterPosition()">Prendre position H4 (Deriv)</button>

    <!-- Bouton de test rapide (simulation d'un signal H4 basé sur Biquote) -->
    <br>
    <button class="btn-test" onclick="simulerArriveeSignalH4()">Simuler un Signal H4</button>

    <!-- Liaison avec ton fichier app.js -->
    <script src="app.js"></script>
</body>
</html>
